name: Keep Activity

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  keep:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update timestamp
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-activity.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-activity.txt
          git diff --staged --quiet && echo "No changes" || (
            git commit -m "chore: keepalive activity $(date -u +%Y-%m-%d)" &&
            git push
          )
