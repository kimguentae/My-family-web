<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <title>가계부</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">

        <button
            type="button"
            id="headerBackButton"
            class="header-back-button"
            onclick="goBackFromHeader()"
        >
            ‹
        </button>

        <h1 id="pageTitle"></h1>

    </header>


    <!-- 입력 -->

    <section id="inputScreen" class="screen active">

        <div class="input-date-row">

            <div
                id="inputDateText"
                class="input-date-text"
            ></div>

            <input
                type="date"
                id="dateInput"
                class="input-date-picker"
            >
<div id="syncStatus" class="sync-status">
    <span class="sync-status-dot"></span>

</div>
        </div>

        <div class="input-section">

            <div class="type-toggle">

                <button
                    type="button"
                    id="expenseBtn"
                    class="type-btn active"
                    onclick="setType('expense')"
                >
                    지출
                </button>

                <button
                    type="button"
                    id="incomeBtn"
                    class="type-btn"
                    onclick="setType('income')"
                >
                    수입
                </button>

            </div>

            <div class="amount-wrap">

                <input
                    type="text"
                    id="amountInput"
                    class="amount-input"
                    placeholder="0"
                    inputmode="numeric"
                    autocomplete="off"
                >

                <span class="won">원</span>

            </div>

            <div
                id="categoryButtons"
                class="category-buttons"
            ></div>

            <div
                id="subjectArea"
                class="subject-area"
            >
                <div
                    id="subjectButtons"
                    class="subject-buttons"
                ></div>
            </div>

            <div
                id="memoArea"
                class="memo-area"
            >

                <input
                    type="text"
                    id="memoInput"
                    class="memo-input"
                    placeholder="메모"
                    autocomplete="off"
                >

            </div>

            <div
                id="paymentArea"
                class="payment-area"
            >

                <div
                    id="paymentButtons"
                    class="payment-buttons"
                ></div>

            </div>

            <button
                type="button"
                class="save-button"
                onclick="saveTransaction()"
            >
                저장
            </button>

        </div>

    </section>


    <!-- 내역 -->

    <section id="historyScreen" class="screen">

        <div class="history-calendar-fixed">

            <div class="calendar-header">

                <div class="calendar-header-left">

                    <button
                        type="button"
                        onclick="changeMonth(-1)"
                    >
                        ‹
                    </button>

                    <div id="calendarTitle"></div>

                    <button
                        type="button"
                        onclick="changeMonth(1)"
                    >
                        ›
                    </button>

                </div>

                <button
                    type="button"
                    class="history-search-button"
                    onclick="toggleHistorySearch()"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-text-search"><path d="M21 5H3"/><path d="M10 12H3"/><path d="M10 19H3"/><circle cx="17" cy="15" r="3"/><path d="m21 19-1.9-1.9"/></svg>
                </button>

            </div>

            <div
                id="historySearchArea"
                class="history-search-area"
            >

                <input
                    type="text"
                    id="historySearchInput"
                    placeholder="메모 검색"
                    autocomplete="off"
                >

                <button
                    type="button"
                    onclick="clearHistorySearch()"
                >
                    ×
                </button>

            </div>

            <div class="calendar-week">

                <div class="sunday">일</div>
                <div>월</div>
                <div>화</div>
                <div>수</div>
                <div>목</div>
                <div>금</div>
                <div class="saturday">토</div>

            </div>

            <div
                id="calendar"
                class="calendar"
            ></div>

        </div>

        <div
            id="selectedDateTitle"
            class="selected-date-title"
        ></div>

        <div id="selectedDateTransactions"></div>

    </section>


<!-- 분석 -->

<section
    id="analysisScreen"
    class="screen"
>

    <div id="analysisDateRow" class="analysis-date-row">

        <div class="analysis-date-item">

            <div
                id="analysisStartDateText"
                class="analysis-date-text"
            ></div>

            <input
                type="date"
                id="analysisStartDate"
                class="analysis-date-picker"
            >

        </div>

        <span class="analysis-date-separator">~</span>

        <div class="analysis-date-item">

            <div
                id="analysisEndDateText"
                class="analysis-date-text"
            ></div>

            <input
                type="date"
                id="analysisEndDate"
                class="analysis-date-picker"
            >

        </div>

    </div>


    <div class="analysis-type-toggle">

        <button
            type="button"
            id="analysisExpenseBtn"
            class="analysis-type-btn active"
            onclick="setAnalysisType('expense')"
        >
            지출
        </button>

        <button
            type="button"
            id="analysisIncomeBtn"
            class="analysis-type-btn"
            onclick="setAnalysisType('income')"
        >
            수입
        </button>

    </div>


    <div
        id="analysisOverallSummary"
        class="analysis-overall-summary"
    ></div>


    <!-- 월별 그래프 -->

    <div
        id="analysisMonthlyChartGroup"
        class="analysis-group"
    >

        <div class="analysis-group-title">
            월별 그래프
        </div>

        <div
            id="analysisMonthlyChart"
            class="monthly-chart"
        ></div>

        <div
            id="analysisMonthlyLegend"
            class="monthly-chart-legend"
        ></div>

    </div>


    <!-- 카테고리 -->

    <div id="analysisCategoryGroup" class="analysis-group">

        <div class="analysis-group-title">
            카테고리
        </div>

        <div
            id="analysisCategoryBar"
            class="analysis-group-bar"
        ></div>

        <div
            id="analysisCategoryBarInfo"
            class="analysis-group-bar-info"
        ></div>

        <div
            id="analysisCategoryList"
            class="analysis-button-grid"
        ></div>

        <div
            id="analysisCategoryDetails"
            class="analysis-detail-list"
        ></div>

    </div>


    <!-- 결제수단 -->

    <div id="analysisPaymentGroup" class="analysis-group">

        <div class="analysis-group-title">
            결제수단
        </div>

        <div
            id="analysisPaymentBar"
            class="analysis-group-bar"
        ></div>

        <div
            id="analysisPaymentBarInfo"
            class="analysis-group-bar-info"
        ></div>

        <div
            id="analysisPaymentList"
            class="analysis-button-grid"
        ></div>

        <div
            id="analysisPaymentDetails"
            class="analysis-detail-list"
        ></div>

    </div>


    <!-- 주체 -->

    <div id="analysisSubjectGroup" class="analysis-group">

        <div class="analysis-group-title">
            주체
        </div>

        <div
            id="analysisSubjectBar"
            class="analysis-group-bar"
        ></div>

        <div
            id="analysisSubjectBarInfo"
            class="analysis-group-bar-info"
        ></div>

        <div
            id="analysisSubjectList"
            class="analysis-button-grid"
        ></div>

        <div
            id="analysisSubjectDetails"
            class="analysis-detail-list"
        ></div>

    </div>

</section>


    <!-- 설정 -->

    <section
        id="settingsScreen"
        class="screen"
    >

        <div class="settings-list">

            <div
                class="setting-row setting-link"
                onclick="showScreen('inputSettings')"
            >
                <span>입력 설정</span>
                <span class="arrow">›</span>
            </div>

            <div
                class="setting-row setting-link"
                onclick="showScreen('budgetSettings')"
            >
                <span>예산 설정</span>
                <span class="arrow">›</span>
            </div>

            <div
                class="setting-row setting-link"
                onclick="showScreen('historySettings')"
            >
                <span>내역 설정</span>
                <span class="arrow">›</span>
            </div>

            <div
                class="setting-row setting-link"
                onclick="showScreen('analysisSettings')"
            >
                <span>분석 설정</span>
                <span class="arrow">›</span>
            </div>

            <div
                class="setting-row setting-link"
                onclick="showScreen('accountSettings')"
            >
                <span>계정 설정</span>
                <span class="arrow">›</span>
            </div>

        </div>

    </section>


    <!-- 입력 설정 -->

    <section
        id="inputSettingsScreen"
        class="screen"
    >

        <div class="settings-list">

            <div
                class="setting-row setting-link"
                onclick="showScreen('memoSettings')"
            >
                <span>메모 설정</span>
                <span class="arrow">›</span>
            </div>

            <div
                class="setting-row setting-link"
                onclick="showScreen('categorySettings')"
            >
                <span>카테고리 설정</span>
                <span class="arrow">›</span>
            </div>

            <div
                class="setting-row setting-link"
                onclick="showScreen('paymentSettings')"
            >
                <span>결제수단 설정</span>
                <span class="arrow">›</span>
            </div>

            <div
                class="setting-row setting-link"
                onclick="showScreen('subjectSettings')"
            >
                <span>주체 설정</span>
                <span class="arrow">›</span>
            </div>

        </div>

    </section>


    <!-- 메모 설정 -->

    <section
        id="memoSettingsScreen"
        class="screen"
    >

        <div class="settings-list">

            <div class="setting-row">

                <span>지출에서 사용</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="memoExpenseToggle"
                        onchange="toggleMemoExpense()"
                    >

                    <span class="slider"></span>

                </label>

            </div>

            <div class="setting-row">

                <span>수입에서 사용</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="memoIncomeToggle"
                        onchange="toggleMemoIncome()"
                    >

                    <span class="slider"></span>

                </label>

            </div>

        </div>

    </section>


    <!-- 카테고리 설정 -->

    <section
        id="categorySettingsScreen"
        class="screen"
    >

        <div class="settings-list">

            <div class="setting-row">

                <span>지출에서 사용</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="categoryExpenseToggle"
                        onchange="toggleCategoryExpense()"
                    >

                    <span class="slider"></span>

                </label>

            </div>

            <div class="setting-row">

                <span>수입에서 사용</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="categoryIncomeToggle"
                        onchange="toggleCategoryIncome()"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <div class="collapse-section">

                <div class="collapse-header">

                    <button
                        type="button"
                        class="collapse-title"
                        onclick="toggleSettingsCollapse('expenseCategoryBody', this)"
                    >
                        <span>지출</span>
                        <span class="collapse-arrow">⌄</span>
                    </button>

                    <button
                        type="button"
                        class="add-button"
                        onclick="addCategory('expense')"
                    >
                        + 추가
                    </button>

                </div>

                <div
                    id="expenseCategoryBody"
                    class="collapse-body"
                >

                    <div
                        id="expenseCategoryList"
                        class="category-manage-list"
                    ></div>

                </div>

            </div>


            <div class="collapse-section">

                <div class="collapse-header">

                    <button
                        type="button"
                        class="collapse-title"
                        onclick="toggleSettingsCollapse('incomeCategoryBody', this)"
                    >
                        <span>수입</span>
                        <span class="collapse-arrow">⌄</span>
                    </button>

                    <button
                        type="button"
                        class="add-button"
                        onclick="addCategory('income')"
                    >
                        + 추가
                    </button>

                </div>

                <div
                    id="incomeCategoryBody"
                    class="collapse-body"
                >

                    <div
                        id="incomeCategoryList"
                        class="category-manage-list"
                    ></div>

                </div>

            </div>

        </div>

    </section>


    <!-- 결제수단 설정 -->

    <section
        id="paymentSettingsScreen"
        class="screen"
    >

        <div class="settings-list">

            <div class="setting-row">

                <span>지출에서 사용</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="paymentExpenseToggle"
                        onchange="togglePaymentExpense()"
                    >

                    <span class="slider"></span>

                </label>

            </div>

            <div class="setting-row">

                <span>수입에서 사용</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="paymentIncomeToggle"
                        onchange="togglePaymentIncome()"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <div class="collapse-section">

                <div class="collapse-header">

                    <button
                        type="button"
                        class="collapse-title"
                        onclick="toggleSettingsCollapse('paymentBody', this)"
                    >
                        <span>결제수단</span>
                        <span class="collapse-arrow">⌄</span>
                    </button>

                    <button
                        type="button"
                        class="add-button"
                        onclick="addPaymentMethod()"
                    >
                        + 추가
                    </button>

                </div>

                <div
                    id="paymentBody"
                    class="collapse-body"
                >

                    <div
                        id="paymentMethodList"
                        class="category-manage-list"
                    ></div>

                </div>

            </div>

        </div>

    </section>


    <!-- 주체 설정 -->

    <section
        id="subjectSettingsScreen"
        class="screen"
    >

        <div class="settings-list">

            <div class="setting-row">

                <span>지출에서 사용</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="subjectExpenseToggle"
                        onchange="toggleSubjectExpense()"
                    >

                    <span class="slider"></span>

                </label>

            </div>

            <div class="setting-row">

                <span>수입에서 사용</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="subjectIncomeToggle"
                        onchange="toggleSubjectIncome()"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <div class="collapse-section">

                <div class="collapse-header">

                    <button
                        type="button"
                        class="collapse-title"
                        onclick="toggleSettingsCollapse('subjectBody', this)"
                    >
                        <span>주체</span>
                        <span class="collapse-arrow">⌄</span>
                    </button>

                    <button
                        type="button"
                        class="add-button"
                        onclick="addSubject()"
                    >
                        + 추가
                    </button>

                </div>

                <div
                    id="subjectBody"
                    class="collapse-body"
                >

                    <div
                        id="subjectList"
                        class="category-manage-list"
                    ></div>

                </div>

            </div>

        </div>

    </section>


    <!-- 예산 설정 -->

    <section
        id="budgetSettingsScreen"
        class="screen"
    >

        <div class="settings-group">

            <div class="settings-group-title">
                카테고리별 월 예산
            </div>

            <div
                id="budgetCategoryList"
                class="analysis-button-grid"
            ></div>

        </div>

    </section>


    <!-- 내역 설정 -->

    <section
        id="historySettingsScreen"
        class="screen"
    >

        <div class="settings-list">

            <div
                class="setting-row setting-link"
                onclick="showScreen('historyExport')"
            >
                <span>거래내역 엑셀로 저장</span>
                <span class="arrow">›</span>
            </div>

        </div>

    </section>


    <!-- 거래내역 엑셀 저장 -->

    <section
        id="historyExportScreen"
        class="screen"
    >

        <div class="export-section">

            <div class="export-label">
                기간 선택
            </div>

            <div class="export-date-row">

                <input
                    type="date"
                    id="exportStartDate"
                    class="export-date-input"
                >

                <span class="export-date-separator">~</span>

                <input
                    type="date"
                    id="exportEndDate"
                    class="export-date-input"
                >

            </div>

            <div class="export-quick-buttons">

                <button
                    type="button"
                    class="export-quick-btn"
                    onclick="setExportRangeThisMonth()"
                >
                    이번 달
                </button>

                <button
                    type="button"
                    class="export-quick-btn"
                    onclick="setExportRangeLastMonth()"
                >
                    지난 달
                </button>

                <button
                    type="button"
                    class="export-quick-btn"
                    onclick="setExportRangeThisYear()"
                >
                    올해
                </button>

                <button
                    type="button"
                    class="export-quick-btn"
                    onclick="setExportRangeAll()"
                >
                    전체
                </button>

            </div>

            <button
                type="button"
                class="save-button"
                onclick="exportTransactionsToExcel()"
            >
                엑셀로 다운로드
            </button>

        </div>

    </section>


    <!-- 분석 설정 -->

    <section
        id="analysisSettingsScreen"
        class="screen"
    >

        <div class="settings-group">

            <div class="settings-group-title">
                분석 항목 표시 / 순서
            </div>

            <div
                id="analysisGroupOrderList"
                class="category-manage-list"
            ></div>

        </div>

    </section>


    <!-- 계정 설정 -->

    <section
        id="accountSettingsScreen"
        class="screen"
    >

        <div
            id="accountLoggedOut"
            class="account-section"
        >

            <div class="account-label">
                이메일
            </div>

            <input
                type="email"
                id="authEmailInput"
                class="account-input"
                placeholder="you@example.com"
                autocomplete="email"
            >

            <div class="account-label">
                비밀번호
            </div>

            <input
                type="password"
                id="authPasswordInput"
                class="account-input"
                placeholder="6자 이상"
                autocomplete="current-password"
            >

            <div
                id="authMessage"
                class="account-message"
            ></div>

            <button
                type="button"
                class="save-button"
                onclick="handleSignIn()"
            >
                로그인
            </button>

            <button
                type="button"
                class="account-secondary-button"
                onclick="handleSignUp()"
            >
                회원가입
            </button>

        </div>


        <div
            id="accountLoggedIn"
            class="account-section"
            style="display: none;"
        >

            <div class="account-label">
                로그인 계정
            </div>

            <div
                id="accountEmailDisplay"
                class="account-email"
            ></div>

            <div
                id="accountSyncStatus"
                class="account-message account-message-info"
            ></div>

            <button
                type="button"
                class="save-button"
                onclick="handleSignOut()"
            >
                로그아웃
            </button>

        </div>

    </section>


    <!-- 하단 메뉴 -->

    <nav class="bottom-nav">

        <button
            type="button"
            class="nav-item active"
            data-screen="input"
            onclick="showScreen('input')"
        >

            <span class="nav-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-circle-plus"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
            </span>
            <span>입력</span>

        </button>

        <button
            type="button"
            class="nav-item"
            data-screen="history"
            onclick="showScreen('history')"
        >

            <span class="nav-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-days"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M8 13h.01"/><path d="M12 13h.01"/><path d="M16 13h.01"/><path d="M8 17h.01"/><path d="M12 17h.01"/><path d="M16 17h.01"/></svg>
            </span>
            <span>내역</span>

        </button>

        <button
            type="button"
            class="nav-item"
            data-screen="analysis"
            onclick="showScreen('analysis')"
        >

            <span class="nav-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chart-pie"><path d="M21 12c.552 0 1.005-.449.95-.998a10 10 0 0 0-8.953-8.951c-.55-.055-.998.398-.998.95v8a1 1 0 0 0 1 1z"/><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/></svg>
            </span>
            <span>분석</span>

        </button>

        <button
            type="button"
            class="nav-item"
            data-screen="settings"
            onclick="showScreen('settings')"
        >

            <span class="nav-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
            <span>설정</span>

        </button>

    </nav>


    <!-- 공용 모달 (alert / confirm / prompt 대체) -->

    <div
        id="appModalOverlay"
        class="modal-overlay"
    >

        <div
            id="appModalBox"
            class="modal-box"
            role="dialog"
            aria-modal="true"
        >

            <div
                id="modalTitle"
                class="modal-title"
            ></div>

            <div
                id="modalMessage"
                class="modal-message"
            ></div>

            <div
                id="modalInputWrap"
                class="modal-input-wrap"
            >

                <input
                    type="text"
                    id="modalInput"
                    class="modal-input"
                    inputmode="text"
                    autocomplete="off"
                >

            </div>

            <div class="modal-buttons">

                <button
                    type="button"
                    id="modalCancelBtn"
                    class="modal-btn modal-btn-cancel"
                >
                    취소
                </button>

                <button
                    type="button"
                    id="modalConfirmBtn"
                    class="modal-btn modal-btn-confirm"
                >
                    확인
                </button>

            </div>

        </div>

    </div>

</div>
